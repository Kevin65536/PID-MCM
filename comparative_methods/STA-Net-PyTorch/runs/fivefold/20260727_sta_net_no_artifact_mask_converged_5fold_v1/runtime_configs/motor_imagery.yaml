schema: sta_net_pytorch_training_v2
data:
  cache_root: data/cache/physiology_semantic_clean_v1
model:
  dropout: 0.6830725854779468
  embedding_dim: 256
  attention_heads: 10
  attention_key_dim: 256
loss:
  main_weight: 1.0
  eeg_aux_weight: 0.5
  alignment_weight: 0.3
  regression_loss: smooth_l1
  class_weighting: none
  label_smoothing: 0.1
training:
  seed: 42
  epochs: 100
  batch_size: 32
  num_workers: 1
  prefetch_factor: 2
  pack_record_batches: false
  adapted_sample_cache_size: 10000
  torch_cpu_threads: 2
  lr: 8.084716496554306e-05
  weight_decay: 0.0005372291923575575
  grad_clip_norm: 1.0
  log_every_steps: 25
  max_steps: 0
  validation_every_epochs: 1
  amp: true
  amp_dtype: bfloat16
  fused_optimizer: true
  scheduler: reduce_on_plateau
  scheduler_total_epochs: 100
  warmup_ratio: 0.0
  selection_min_delta: 0.0
  selection_metric: macro_f1
  selection_mode: max
  plateau_factor: 0.5
  plateau_patience: 8
  plateau_threshold: 0.0001
  min_lr: 1.0e-06
  early_stopping_min_epochs: 40
  early_stopping_patience: 30
task_overrides:
  motor_imagery:
    batch_size: 32
    num_workers: 1
    adapted_sample_cache_size: 10000
    scheduler: reduce_on_plateau
    warmup_ratio: 0.0
    plateau_factor: 0.5
    plateau_patience: 8
    plateau_threshold: 0.0001
    min_lr: 1.0e-06
    early_stopping_min_epochs: 40
    early_stopping_patience: 30
  wg:
    batch_size: 32
tuning:
  schema: sta_net_optuna_tuning_v3
  trial_number: 11
  rung_epochs:
  - 2
  - 8
  - 20
  - 40
  - 100
  selection_metric: macro_f1
  search_profile: final_mi_wg
  intervention_regime: slow_regularized
