schema: sta_net_pytorch_smoke_v1
tasks:
  - wg
  - nback
  - refed_regression

data:
  cache_root: data/cache/physiology_semantic_clean_v1

model:
  dropout: 0.5
  embedding_dim: 256
  attention_heads: 10
  attention_key_dim: 256

loss:
  main_weight: 1.0
  eeg_aux_weight: 1.0
  alignment_weight: 1.0
  regression_loss: smooth_l1

training:
  device: auto
  seed: 42
  lr: 0.0001
  weight_decay: 0.0
  grad_clip_norm: 1.0
  amp: false

smoke:
  train_subject_count: 2
  samples_per_split: 2
