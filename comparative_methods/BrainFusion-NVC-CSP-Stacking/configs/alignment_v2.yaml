schema: brainfusion_adapter_alignment_v2
method_id: brainfusion_nvc_csp_stacking_reimplementation
mode: public_audit_only
protected_test_default: locked

registry:
  manifest: comparative_methods/EFRM-PyTorch/runs/formal/efrm_lodo_full_target_fivefold_v2/protocol/shared_full_target_fold_registry/registry_manifest.json
  registry_sha256: 2a10b36db85dba6ec5543edc7810ff85d978ea5af8c79fda3d38a1e5cfd11106
  protocol: strict_cross_subject
  outer_folds: [0, 1, 2, 3, 4]

data:
  cache_root: data/cache/physiology_semantic_clean_v1
  eeg_sample_rate_hz: 200
  fnirs_sample_rate_hz: 10
  required_modalities: [eeg, fnirs_hbo, fnirs_hbr]
  support_policy: full_recorded_and_analysis_valid_support_only
  channel_policy: frozen_task_inventory_real_measured_channels_no_copy_no_padding

observation_budget:
  alignment_profile: support_matched_direct
  anchor: canonical_registry_window_start
  extra_pre_anchor_context_s: 0.0
  extra_post_interval_context_s: 0.0
  hrf_is_method_local_transform_not_permission_for_extra_input: true
  minimum_supported_nvc_interval_s: 8.0
  dsr_disposition: unsupported_because_two_seconds_cannot_support_frozen_nvc_hrf_contract
  refed_disposition: unsupported_classification_pipeline_and_partial_terminal_support

adapter:
  eeg_downsampling: nonoverlapping_mean_20_samples_to_10hz
  nvc_branch: public_avg_raw_component
  nvc_normalization: per_sample_per_channel_minmax_source_declared_stateless
  hrf:
    tr: 1.0
    oversampling: 1
    time_length_s: 32.0
    convolution: causal_full_then_crop_to_observed_interval
  learned_transforms:
    - csp_filters_outer_training_only
    - nvc_pair_selection_outer_training_only
    - feature_standardizers_outer_training_only
    - base_estimators_outer_training_only
    - stacking_oof_meta_estimator_outer_training_only

