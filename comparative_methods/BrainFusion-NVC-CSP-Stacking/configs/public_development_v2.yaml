alignment_config: comparative_methods/BrainFusion-NVC-CSP-Stacking/configs/alignment_v2.yaml

job_matrix:
  tasks: [motor_imagery, mental_arithmetic, wg, nback, visual]
  outer_folds: [0, 1, 2, 3, 4]
  seeds: [17, 42, 73]
