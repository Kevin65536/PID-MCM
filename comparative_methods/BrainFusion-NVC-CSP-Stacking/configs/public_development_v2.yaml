  linear_svm_c_values: [0.1, 1.0]
  rbf_svm_c_values: [1.0]
  random_forest_estimators: 200
  random_forest_max_depth: null
  meta_svm_c: 1.0

smoke:
  train_samples_per_class: 18
  validation_samples_per_class: 8
  inner_folds: 3
  random_forest_estimators: 24

reporting:
  primary_endpoint: macro_f1
  table_admissible: false
  claim_boundary: public_development_only
  protected_evaluation_authorized: false
