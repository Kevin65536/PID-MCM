cell_evidence_schema:
  schema: adapter_alignment_cell_evidence_v2
  required_top_level_fields:
    - schema
    - cell_id
    - comparison_group_id
    - method_id
    - task_id
    - track
    - alignment_profile
    - evidence_scope
    - cell_status
    - comparison_fields
    - adapter_identity
    - gate_status
  comparison_fields_follow_alignment_profile: true
  gate_status_requires_all_gate_ids: true
  unsupported_requires:
    - unsupported_reason_code
    - unsupported_reason
  pass_requires_all_gates_pass: true
