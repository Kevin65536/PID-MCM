declared_deviations:
  - all pretraining inputs are synchronized paired EEG-fNIRS
  - EEG and fNIRS sampling rates are 200 Hz and 10 Hz
  - physical patch durations are preserved with 50- and 20-sample patches
  - valid measured channel counts are variable and channels are never duplicated
  - all seven shared benchmark tasks are evaluated
  - REFED uses an explicitly named sequence-regression adapter
  - the active formal track uses four target-dataset-excluded LODO checkpoints
  - downstream evaluation uses the complete target dataset and a method-neutral shared five-fold registry
  - every downstream fold is refitted on its complete outer-training partition after inner epoch selection
