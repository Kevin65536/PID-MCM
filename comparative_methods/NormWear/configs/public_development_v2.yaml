smoke:
  train_samples_per_class: 4
  validation_samples_per_class: 4
  epoch_cap: 2
  learning_rates: [0.001]
  weight_decays: [0.0]

failure_policy:
  retain_failed_status: true
  automatic_retry_count: 0
  completed_run_overwrite: forbidden

resources:
  device: cuda:1
  minimum_free_gpu_gib: 6
  gpu_lock_path: /tmp/pid_mcm_normwear_public_gpu1.lock
  run_root: comparative_methods/NormWear/runs/public_development_v2
