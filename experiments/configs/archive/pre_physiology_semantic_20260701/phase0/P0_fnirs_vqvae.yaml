# Phase 0 Experiment: VQ-VAE Tokenizer on fNIRS Data
# Inherits from base.yaml

experiment:
  name: "P0_fNIRS_VQVAE"
  description: "VQ-VAE tokenizer on real fNIRS data - compare with FSQ"
  seed: 42

data:
  modality: "fnirs"
  dataset: "TBD"  # TODO: Specify dataset path
  preprocessing:
    resample_rate: 10
    lowpass: 0.1
    signal_type: "hbo"
  window:
    length: 100
    stride: 50

model:
  type: "vqvae"
  input_channels: 1
  seq_length: 100
  
  encoder:
    hidden_dims: [32, 64, 128]
    kernel_size: 5
    stride: 2
  
  quantizer:
    codebook_size: 512
    embedding_dim: 64
    commitment_cost: 0.25
    ema_decay: 0.99
    reset_unused: true
    reset_threshold: 0.01
  
  decoder:
    hidden_dims: [128, 64, 32]
    kernel_size: 5
    stride: 2

loss:
  reconstruction:
    weight: 1.0
    type: "mse"
  spectral:
    weight: 0.05
    enabled: true
    type: "multi_stft"
    fft_sizes: [16, 32, 64]
  commitment:
    weight: 0.25
  smoothness:
    weight: 0.1
    enabled: true

training:
  epochs: 100
  batch_size: 64
  learning_rate: 0.001

evaluation:
  metrics:
    - reconstruction_mse
    - perplexity
    - code_utilization
    - dead_codes
    - commitment_loss
  thresholds:
    perplexity_min: 150
    code_utilization_min: 0.2
    dead_codes_max_ratio: 0.3
