_base_: "./default.yaml"

experiment:
  name: "s2_phase1_gate1_debug"
  description: "Phase 1 Gate1 debugging run with conservative alignment warmup"

training:
  epochs: 80
  batch_size: 16
  learning_rate: 0.0005
  warmup_epochs: 10
  min_lr: 0.00001
  alignment_warmup:
    enabled: true
    start_epoch: 5
    ramp_epochs: 20
    start_scale: 0.0
  early_stopping:
    enabled: true
    patience: 20
    metric: "val_loss"
    mode: "min"