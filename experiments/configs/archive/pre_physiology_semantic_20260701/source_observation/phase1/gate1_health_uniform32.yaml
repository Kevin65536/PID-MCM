_base_: "./gate1_diag_coupling_off.yaml"

experiment:
  name: "s2_phase1_gate1_health_uniform32"
  description: "Phase 1 Gate1 health run with uniformly smaller codebooks and stronger balance"

model:
  source:
    codebook_size: 32
  eeg_observation:
    codebook_size: 32
  fnirs_observation:
    codebook_size: 32
  quantizer:
    beta: 0.5
    decay: 0.95
    dead_code_threshold: 20

loss:
  codebook:
    balance_weight: 0.08

training:
  learning_rate: 0.0003
