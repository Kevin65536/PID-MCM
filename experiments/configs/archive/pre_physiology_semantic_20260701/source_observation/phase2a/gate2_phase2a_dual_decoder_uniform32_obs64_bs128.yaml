_base_: "../phase1/gate1_baseline_locked_bs128.yaml"

experiment:
  name: "s2_phase2a_gate2_dual_decoder_uniform32_obs64_bs128"
  description: "Phase 2A baseline with dual decoders, unified source targets, and explicit observation targets"

model:
  source:
    codebook_size: 32
  eeg_observation:
    codebook_size: 64
  fnirs_observation:
    codebook_size: 64

loss:
  source_target:
    weight: 0.3
    eeg_source_aux_weight: 1.0
    warmup_epochs: 30
    eeg_target_mode: signed_rms_carrier
    shared_state_alpha: 0.90
    hrf:
      kernel_duration_s: 24.0
      peak_delay_s: 6.0
      peak_dispersion_s: 1.0
      undershoot_delay_s: 16.0
      undershoot_dispersion_s: 1.5
      peak_scale: 1.0
      undershoot_scale: 0.25
  observation_target:
    weight: 0.15
    warmup_epochs: 30
  coupling:
    weight: 0.0
  branch:
    orthogonality_weight: 0.05
  codebook:
    balance_weight: 0.08
    source_assignment_temperature: 2.0
    observation_assignment_temperature: 1.0
    source_balance_scale: 1.0
    observation_balance_scale: 0.5

training:
  alignment_warmup:
    enabled: true
    start_epoch: 1
    ramp_epochs: 30
    start_scale: 0.0
    end_scale: 1.0
  source_target_warmup:
    enabled: true
    start_epoch: 1
    ramp_epochs: 30
    start_scale: 0.0
    end_scale: 1.0
  observation_target_warmup:
    enabled: true
    start_epoch: 1
    ramp_epochs: 30
    start_scale: 0.0
    end_scale: 1.0
