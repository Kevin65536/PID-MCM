_base_: "./highwl_v2_coupling_calibration_fixed_init_gpu0.yaml"

experiment:
  name: "s2_croce_local_highwl_v2_coupling_calibration_cognitive_only"
  device: "cuda:0"
  description: "Frozen-token residual coupling calibration restricted to the simultaneous cognitive cache source."

data:
  cache_sources:
    - name: "simultaneous_cognitive"
      root: "croce_validation/cache/croce_local/highwl_v2/simultaneous_cognitive"
      task: "cognitive"
      event_window_pre_s: 10.0

training:
  coupling_calibration:
    epochs: 40
    patience: 10

