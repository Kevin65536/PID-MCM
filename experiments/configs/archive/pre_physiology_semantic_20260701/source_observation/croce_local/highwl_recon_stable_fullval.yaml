_base_: "./highwl_gpu_probe.yaml"

experiment:
  name: "s2_croce_local_highwl_recon_stable_fullval"
  device: "cuda:1"
  description: "Croce local highWL-only reconstruction-stability run with full validation and target losses held out"

data:
  num_workers: 12
  max_npz_cache_size: 192
  dataloader:
    persistent_workers: true
    prefetch_factor: 3
    drop_last: true

loss:
  source_target:
    weight: 0.0
  observation_target:
    weight: 0.0

training:
  batch_size: 512
  epochs: 80
  min_lr: 0.00002
  performance:
    tf32: true
    matmul_precision: "high"
  validation:
    interval_epochs: 2
    start_epoch: 1
    max_batches: null
  early_stopping:
    enabled: true
    start_epoch: 20
    patience: 16
  quantization_warmup:
    enabled: true
    start_epoch: 1
    ramp_epochs: 90
    start_scale: 0.0
    end_scale: 1.0
  source_target_warmup:
    enabled: true
    start_epoch: 1
    ramp_epochs: 1
    start_scale: 0.0
    end_scale: 0.0
  observation_target_warmup:
    enabled: true
    start_epoch: 1
    ramp_epochs: 1
    start_scale: 0.0
    end_scale: 0.0
  checkpoint:
    save_every: 20
