experiment:
  name: "e1_t0_measurement_first_smoke_v1"
  run_group: "physiology_semantic_tokenizer/e1_quantizer_correctness"
  description: >-
    Correctness-only T0 smoke through UnifiedPhysiologyWindowDataset and the
    measured local-view adapter. This single-dataset smoke cannot promote E1.

data:
  loader_class: "UnifiedPhysiologyLocalViewDataset"
  contract: "physiology_semantic_measurement_local_v1"
  cache_root: "data/cache/physiology_semantic_clean_v1"
  dataset_ids: ["eeg_fnirs_single_trial"]
  task_namespaces: ["eeg_fnirs_single_trial:motor_imagery"]
  reject_unknown_labels: true
  split:
    train_subject_keys:
      - "eeg_fnirs_single_trial|subject_01"
      - "eeg_fnirs_single_trial|subject_02"
      - "eeg_fnirs_single_trial|subject_03"
      - "eeg_fnirs_single_trial|subject_04"
      - "eeg_fnirs_single_trial|subject_05"
      - "eeg_fnirs_single_trial|subject_06"
      - "eeg_fnirs_single_trial|subject_07"
      - "eeg_fnirs_single_trial|subject_08"
      - "eeg_fnirs_single_trial|subject_09"
      - "eeg_fnirs_single_trial|subject_10"
      - "eeg_fnirs_single_trial|subject_11"
      - "eeg_fnirs_single_trial|subject_12"
      - "eeg_fnirs_single_trial|subject_13"
      - "eeg_fnirs_single_trial|subject_14"
      - "eeg_fnirs_single_trial|subject_15"
      - "eeg_fnirs_single_trial|subject_16"
      - "eeg_fnirs_single_trial|subject_17"
      - "eeg_fnirs_single_trial|subject_18"
    val_subject_keys:
      - "eeg_fnirs_single_trial|subject_19"
      - "eeg_fnirs_single_trial|subject_20"
      - "eeg_fnirs_single_trial|subject_21"
      - "eeg_fnirs_single_trial|subject_22"
      - "eeg_fnirs_single_trial|subject_23"
    test_subject_keys:
      - "eeg_fnirs_single_trial|subject_24"
      - "eeg_fnirs_single_trial|subject_25"
      - "eeg_fnirs_single_trial|subject_26"
      - "eeg_fnirs_single_trial|subject_27"
      - "eeg_fnirs_single_trial|subject_28"
      - "eeg_fnirs_single_trial|subject_29"
  window: {duration_s: 20.0}
  local_view:
    eeg_channels: 6
    allow_cross_coordinate_systems: false
  auxiliary_target: {family: null, version: null}
  num_workers: 0
  dataloader:
    pin_memory: true
    drop_last: true

model:
  type: "physiology_semantic"
  encoder: {eeg_dim: 256, fnirs_dim: 160}
  quantizer:
    codebook_size: 128
    embedding_dim: 64
    assignment: "euclidean"
    decay: 0.99
    eps: 1.0e-5
    commitment_cost: 0.25
    temperature: 1.0
    revive_dead_codes: true
    dead_code_threshold: 0.1
    revival_warmup_steps: 100
    revival_interval: 100
  residual: {eeg_dim: 64, fnirs_dim: 32}
  context: {history_tokens: 5}

loss:
  uncertainty_weighting: false
  state: {weight: 0.0}
  prototype: {weight: 0.0}
  masked_state: {weight: 0.0}
  reconstruction: {weight: 1.0}
  vq: {weight: 1.0}
  private: {weight: 0.0}
  entry_routing:
    local:
      eeg: ["r_mean", "r_slope"]
      fnirs: ["delta_hbo_mean", "delta_hb_mean", "delta_hbo_slope", "delta_hb_slope"]
    prototype:
      eeg: ["r_mean", "r_slope"]
      fnirs: ["delta_hbo_mean", "delta_hb_mean", "delta_hbo_slope", "delta_hb_slope"]
    context: {eeg: [], fnirs: []}
    coupling: {eeg: [], fnirs: []}

training:
  batch_size: 8
  seed: 20260719
  device: "cuda:0"
  epochs: 1
  lr: 1.0e-4
  weight_decay: 0.01
  betas: [0.9, 0.98]
  warmup_steps: 2
  grad_clip_norm: 1.0
  amp: true
  early_stopping_patience: 1
  early_stopping_min_delta: 1.0e-4
  smoke_optimizer_steps: 4

validation:
  phase: "e1_t0_measurement_first_correctness_smoke"
  e0_gate_path: null
  protected_test_metrics: false
