composite:
  coordinates: [log_gain, log_time, logit_zeta, log_tv]
  definitions:
    gain: beta / gamma
    time: 1 / sqrt(gamma)
    zeta: kappa / (2 * sqrt(gamma))
    tv: tau * alpha
  candidate_ladder: [C0_fixed, C1_G, C1_T, C2_GT]
  deferred_coordinates: [zeta, tv, alpha, E0]
  random_effect_coordinates: [gain, time]
  fixed_coordinate_gauge: [zeta, tv, alpha, E0, optical_observation]
  reference:
    beta: 1.0
    kappa: 0.64
    gamma: 0.32
    tau: 2.0
    alpha: 0.32
    E0: 0.32
  raw_bounds:
    beta: [0.25, 4.0]
    kappa: [0.20, 1.50]
    gamma: [0.10, 1.00]
    tau: [0.50, 5.00]
    alpha: [0.10, 0.80]
    E0: [0.10, 0.80]

hierarchy:
  family: independent_normal_normal_partial_pooling
  full_covariance_enabled: false
  maximum_random_effect_dimensions: 2
  measured_fit_enabled_after_admission_only: true

admission:
  required_checks:
    - prior_runs_complete
    - t_p2_identifiability_supported
    - cross_subject_stability_failure_in_common_gauge
    - common_observation_and_driver_gauge_frozen
    - fixed_local_fnirs_endpoint_frozen
    - composite_synthetic_sbc_profile_multistart_passed
    - practical_margin_frozen_before_measured_scoring
    - validation_and_protected_arrays_closed
  on_unmet: stop_before_measured_metadata_or_array_access

output:
  root: experiments/runs/physiology_semantic_tokenizer/t3c_hierarchical_composite_admission
