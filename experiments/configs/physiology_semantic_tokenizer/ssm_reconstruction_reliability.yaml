analysis:
  seed: 20260819
  folds: 5
  workers: 10
  bootstrap_iterations: 10000
  fnirs_active_hbo_channels: 1
  local_eeg_channels: 6
  core_spatial_modes: [local, global]
  descriptive_spatial_modes: [local]
  ssm:
    fs_hz: 10.0
    prior_strength: 0.03
    max_iterations: 60
    q_scale_candidates: [0.5, 1.0, 2.0]
    fnirs_noise_scale_candidates: [0.25, 0.5, 1.0, 2.0, 4.0]
    balance_penalty: 0.25
    max_flow_perturbation: 0.25

output:
  root: experiments/runs/physiology_semantic_tokenizer/e0_teacher_validity
