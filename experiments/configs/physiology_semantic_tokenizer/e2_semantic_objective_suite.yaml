experiment:
  name: "e2_semantic_objective_suite_v1"
  run_group: "physiology_semantic_tokenizer/e2_semantic_objectives"
  description: >-
    Development-only T0/T1/T2 comparison on measured Single-Trial mental-
    arithmetic windows. The adaptive joint teacher is a detached privileged
    sidecar, protected subjects remain unopened, and E6 retention promotion is
    outside this suite.

data:
  loader_class: "UnifiedPhysiologyLocalViewDataset"
  contract: "physiology_semantic_measurement_local_v1"
  cache_root: "data/cache/physiology_semantic_clean_v1"
  dataset_ids: ["eeg_fnirs_single_trial"]
  task_namespaces: ["eeg_fnirs_single_trial:mental_arithmetic"]
  eeg_signal_branch: "single_trial_eeg_artifact_clean_v4"
  reject_unknown_labels: true
  split:
    train_subject_keys:
      - "eeg_fnirs_single_trial|subject_01"
      - "eeg_fnirs_single_trial|subject_02"
      - "eeg_fnirs_single_trial|subject_03"
      - "eeg_fnirs_single_trial|subject_04"
      - "eeg_fnirs_single_trial|subject_05"
      - "eeg_fnirs_single_trial|subject_06"
      - "eeg_fnirs_single_trial|subject_07"
      - "eeg_fnirs_single_trial|subject_08"
      - "eeg_fnirs_single_trial|subject_09"
      - "eeg_fnirs_single_trial|subject_10"
      - "eeg_fnirs_single_trial|subject_11"
      - "eeg_fnirs_single_trial|subject_12"
      - "eeg_fnirs_single_trial|subject_13"
      - "eeg_fnirs_single_trial|subject_14"
      - "eeg_fnirs_single_trial|subject_15"
      - "eeg_fnirs_single_trial|subject_16"
      - "eeg_fnirs_single_trial|subject_17"
      - "eeg_fnirs_single_trial|subject_18"
    val_subject_keys:
      - "eeg_fnirs_single_trial|subject_19"
      - "eeg_fnirs_single_trial|subject_20"
      - "eeg_fnirs_single_trial|subject_21"
      - "eeg_fnirs_single_trial|subject_22"
      - "eeg_fnirs_single_trial|subject_23"
    test_subject_keys:
      - "eeg_fnirs_single_trial|subject_24"
      - "eeg_fnirs_single_trial|subject_25"
      - "eeg_fnirs_single_trial|subject_26"
      - "eeg_fnirs_single_trial|subject_27"
      - "eeg_fnirs_single_trial|subject_28"
      - "eeg_fnirs_single_trial|subject_29"
  window: {duration_s: 20.0, offset_s: -5.0}
  local_view:
    eeg_channels: 6
    allow_cross_coordinate_systems: false
  auxiliary_target:
    family: "adaptive_multimodal_consensus_proxy"
    version: "adaptive_ssm_gauge_corrected_patch_v1"
    root: "data/cache/physiology_semantic_targets_v1/adaptive_ssm_e2_development"
    required_splits: []
  num_workers: 4
  dataloader:
    pin_memory: true
    drop_last: true
    persistent_workers: true
    prefetch_factor: 2

model:
  type: "physiology_semantic"
  encoder: {eeg_dim: 256, fnirs_dim: 160}
  quantizer:
    codebook_size: 128
    embedding_dim: 64
    assignment: "cosine"
    normalize_latents: true
    decay: 0.95
    eps: 1.0e-5
    commitment_cost: 0.25
    temperature: 1.0
    kmeans_init: true
    kmeans_iters: 10
    revive_dead_codes: true
    dead_code_threshold: 0.1
    revival_warmup_steps: 100
    revival_interval: 100
    revival_stop_after_steps: 200
    max_revivals_per_event: 128
    revival_noise_std: 0.01
    revival_strategy: "diverse_farthest"
    revival_count_prior: "threshold"
  residual: {eeg_dim: 64, fnirs_dim: 32}
  context: {history_tokens: 5}

loss:
  uncertainty_weighting: false
  state: {weight: 0.0}
  prototype: {weight: 0.0}
  masked_state: {weight: 0.0}
  reconstruction: {weight: 1.0, mode: "semantic_only", semantic_input: "annealed_hard"}
  vq: {weight: 1.0}
  private: {weight: 0.0}
  codebook_balance:
    weight: 0.16
    temperature: 2.0
    eeg_temperature: 2.0
    fnirs_temperature: 2.0
    eeg_scale: 1.0
    fnirs_scale: 1.0
  entry_routing:
    local: {eeg: [], fnirs: []}
    prototype: {eeg: [], fnirs: []}
    context: {eeg: [], fnirs: []}
    coupling: {eeg: [], fnirs: []}

training:
  batch_size: 32
  seed: 20260719
  device: "cuda:0"
  epochs: 14
  lr: 1.0e-4
  weight_decay: 0.01
  betas: [0.9, 0.98]
  warmup_steps: 50
  quantization_warmup:
    enabled: true
    start_epoch: 1
    ramp_epochs: 6
    start_scale: 0.0
    end_scale: 1.0
  grad_clip_norm: 1.0
  amp: true
  early_stopping_patience: 14
  early_stopping_min_delta: 1.0e-4
  smoke_optimizer_steps: 4

validation:
  phase: "e2_semantic_objective_development_v1"
  primary_endpoint: "heldout_hard_token_registered_signature_mean_r2"
  selection_metric: "validation total loss within row"
  promotion_eligible: false
  target_family_gate_path: >-
    data/cache/physiology_semantic_targets_v1/adaptive_ssm_e2_development/target_family_gate.json
  semantic_weight_calibration_path: >-
    experiments/runs/physiology_semantic_tokenizer/e2_weight_calibration/20260723_e2_v4_training_gradient_weight_calibration_v1/analysis/summary.json
  protected_test_metrics: false
  registered_factors:
    e1_quantizer_candidate: "diverse_farthest_t2_t2_k128_v23"
    data_window: "20 s from -5 s to +15 s relative to event"
    target_standardization: "coordinatewise train-subject-only"
    uncertainty_weighting: false
    semantic_loss_weight: 0.005
    teacher_coverage_policy: "masked sparse sidecar; identical samples and views in T0/T1/T2"
  gradient_audit:
    enabled: true
    strict: true
    steps: [0, 1, 2, 3]
    tolerance: 1.0e-12
    objectives: ["eeg_reconstruction", "fnirs_reconstruction", "eeg_balance", "fnirs_balance"]
  e2_evaluation:
    row: "T0"
    signature_coordinates:
      eeg: ["r_mean", "r_slope"]
      fnirs: ["delta_hbo_mean", "delta_hb_mean", "delta_hbo_slope", "delta_hb_slope"]
    optional_signature_coordinates:
      eeg: ["s_mean", "s_slope"]
      fnirs: []
    ridge_alphas: [0.1, 1.0, 10.0, 100.0]
    bootstrap_iterations: 2000
    null_iterations: 256

e2_suite:
  seeds: [20260719, 20260720, 20260721]
  rows:
    T0:
      state_weight: 0.0
      prototype_weight: 0.0
      eeg_coordinates: []
      fnirs_coordinates: []
    T1:
      state_weight: 0.005
      prototype_weight: 0.005
      eeg_coordinates: ["r_mean", "r_slope"]
      fnirs_coordinates: ["delta_hbo_mean", "delta_hb_mean", "delta_hbo_slope", "delta_hb_slope"]
    T2:
      state_weight: 0.005
      prototype_weight: 0.005
      eeg_coordinates: ["r_mean", "r_slope", "s_mean", "s_slope"]
      fnirs_coordinates: ["delta_hbo_mean", "delta_hb_mean", "delta_hbo_slope", "delta_hb_slope"]
